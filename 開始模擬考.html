","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":46,"stem":"所謂的巧克力囊腫（chocolate cyst）是指卵巢（ovary）中有何種組織？","options":{"A":"泌尿上皮（urothelium）","B":"甲狀腺濾泡（thyroid follicles）","C":"子宮內膜（endometrium）","D":"初級神經上皮（primitive neuroepithelium）"},"pages":[9],"images":["assets/115020_308_0107/page-09.jpg"],"hasImages":false,"id":"115020_308_0107:46","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":47,"stem":"有關第一型與第二型糖尿病（diabetes）之比較，下列何者錯誤？","options":{"A":"第一型糖尿病好發於小孩，第二型糖尿病則好發於成人","B":"在發病初期，第一型糖尿病患者之血中胰島素值常升高，第二型糖尿病患者之血中胰島素值則常降低","C":"第一型糖尿病與自體免疫有關，第二型糖尿病則與周邊組織之胰島素拮抗有關","D":"第一型糖尿病之胰島組織常有發炎細胞浸潤，第二型糖尿病之胰島組織則常有類澱粉沉積"},"pages":[9,10],"images":["assets/115020_308_0107/page-09.jpg","assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:47","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":48,"stem":"唾液腺腫瘤最好發於那個唾液腺器官？","options":{"A":"腮腺（parotid gland）","B":"頷下腺（submandibular gland）","C":"舌下腺（sublingual gland）","D":"小唾液腺（minor salivary gland）"},"pages":[10],"images":["assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:48","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":49,"stem":"有關快速進展型腎絲球腎炎（rapidly progressive glomerulonephritis, RPGN）的敘述，下列何者錯誤？","options":{"A":"個案切片常會有腎絲球新月（glomerular crescent）出現","B":"腎絲球新月（glomerular crescent）病理變化主要是腎絲球體血管內皮細胞（endothelial cells）的增生\n以及一些白血球的浸潤造成","C":"致病機制大多是免疫媒介（immunologically mediated）","D":"古德巴斯德病（Goodpasture disease）造成的腎絲球變化常是這種快速進展型腎絲球腎炎"},"pages":[10],"images":["assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:49","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":50,"stem":"有關腫瘤細胞的瓦爾堡效應（Warburg effect），下列何者正確？","options":{"A":"在無氧的情況下才能進行","B":"將乳酸轉化為葡萄糖","C":"僅出現在腫瘤，非腫瘤細胞不會出現瓦爾堡效應","D":"可提供合成細胞成分所需的代謝中間產物"},"pages":[10],"images":["assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:50","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":51,"stem":"依據美國癌症聯合委員會（American Joint Committee on Cancer, AJCC）的 TNM 分期（TNM staging），下\n列何者的預後（prognosis）最佳？","options":{"A":"TisN0M0","B":"T2N1M0","C":"T3N0M0","D":"T4N2M1"},"pages":[10],"images":["assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:51","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":52,"stem":"下列何者是人類最常見遺傳性疾病的成因？","options":{"A":"單一基因突變","B":"多基因異常加上環境影響","C":"染色體數目及構造異常","D":"粒線體 DNA 突變"},"pages":[10],"images":["assets/115020_308_0107/page-10.jpg"],"hasImages":false,"id":"115020_308_0107:52","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":53,"stem":"下列何者與乙型海洋性貧血（β-thalassemia）最相關？","options":{"A":"球蛋白（globin）基因發生突變","B":"染色體 9 與染色體 22 發生轉位 t（9;22）","C":"抗體攻擊紅血球","D":"X 染色體發生基因突變"},"pages":[10,11],"images":["assets/115020_308_0107/page-10.jpg","assets/115020_308_0107/page-11.jpg"],"hasImages":false,"id":"115020_308_0107:53","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":54,"stem":"有關 BMI（body mass index）的敘述，下列何者錯誤？","options":{"A":"BMI＜18.5 為體重過輕","B":"18.5＜BMI＜24 為健康體位","C":"超過標準體重 10％以上稱為過重","D":"超過標準體重 30％以上為輕度肥胖"},"pages":[11],"images":["assets/115020_308_0107/page-11.jpg"],"hasImages":false,"id":"115020_308_0107:54","imageOnlyPages":[],"answer":"D","rule":{"accepted":["C","D","CD"],"fullCredit":false,"requireAnswer":false,"note":"第54題答C或D或CD者均給分"}},{"number":55,"stem":"有關熱衰竭（heat exhaustion）之敘述，下列何者錯誤？","options":{"A":"是因為下視丘體溫調節中樞將體溫設定值調高引起","B":"可造成心血管系統無法代償的低血容量性休克（hypovolemic shock）","C":"患者可出現皮膚蒼白濕冷、血壓下降、虛弱或昏倒情形","D":"處理方式為將患者移到陰涼處，躺平、頭部放低，補充水分及鹽分"},"pages":[11],"images":["assets/115020_308_0107/page-11.jpg"],"hasImages":false,"id":"115020_308_0107:55","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":56,"stem":"下列何種皮膚病變，與砷（arsenic）的長期暴露最無關？","options":{"A":"鱗狀細胞癌（squamous cell carcinoma）","B":"過度角化（hyperkeratosis）","C":"基底細胞癌（basal cell carcinoma）","D":"黑色素瘤（melanoma）"},"pages":[11],"images":["assets/115020_308_0107/page-11.jpg"],"hasImages":false,"id":"115020_308_0107:56","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":57,"stem":"有關金黃色葡萄球菌（Staphylococcus aureus）引起的葡萄球菌性燙傷樣皮膚綜合症（Staphylococcal \nscalded-skin syndrome）的敘述，下列何者正確？","options":{"A":"主要是由金黃色葡萄球菌產生的 superantigen 造成","B":"主要是由金黃色葡萄球菌產生的γ-toxin 造成","C":"皮膚水泡主要是發生在表皮與真皮交接處","D":"皮膚水泡主要是發生在表皮內的顆粒層（stratum granulosum）"},"pages":[11],"images":["assets/115020_308_0107/page-11.jpg"],"hasImages":false,"id":"115020_308_0107:57","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":58,"stem":"一位男性患者下巴，手術切開皮下軟組織，發現膿液中有黃色的硫磺顆粒（sulfur granules），最有可能是\n下列何種疾病？","options":{"A":"粟粒狀結核（miliary tuberculosis）","B":"橡膠腫（gumma）","C":"放線菌病（actinomycosis）","D":"鵝口瘡（thrush）"},"pages":[11,12],"images":["assets/115020_308_0107/page-11.jpg","assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:58","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":59,"stem":"多發性硬化症（multiple sclerosis, MS）是中樞神經系統的何種疾病？","options":{"A":"免疫性疾病","B":"退化性疾病","C":"代謝性疾病","D":"感染性疾病"},"pages":[12],"images":["assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:59","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":60,"stem":"免疫球蛋白 G4 相關疾病（IgG4-related disease）病灶的病理學特徵最主要為下列何者？","options":{"A":"大量製造 IgG4 抗體的漿細胞","B":"乾酪性壞死","C":"形成壞死性動脈硬化","D":"極度血管增生"},"pages":[12],"images":["assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:60","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":61,"stem":"下列何種抗體對診斷類風濕性關節炎（rheumatoid arthritis）較具專一性？","options":{"A":"抗雙股 DNA 抗體（anti-double-stranded DNA antibody）","B":"抗環瓜氨酸抗體（anti-cyclic citrullinated peptide antibody）","C":"類風濕因子（rheumatoid factor）","D":"抗史密斯抗原抗體（anti-Smith antigen antibody）"},"pages":[12],"images":["assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:61","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":62,"stem":"成人最常見的惡性淋巴瘤（lymphoma）組織型態為何？","options":{"A":"伯基特氏淋巴瘤（Burkitt lymphoma）","B":"瀰漫性大型 B 細胞淋巴瘤（diffuse large B cell lymphoma）","C":"小淋巴球性淋巴瘤（small lymphocytic lymphoma）","D":"被套細胞淋巴瘤（mantle cell lymphoma）"},"pages":[12],"images":["assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:62","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":63,"stem":"一年輕高瘦男性病人，健檢時發現有主動脈擴張及主動脈瘤（aneurysm），其最有可能罹患下列何種疾病？","options":{"A":"先天性成骨不全（achondroplasia）","B":"馬凡氏症候群（Marfan syndrome）","C":"古德帕斯德症候群（Goodpasture syndrome）","D":"卡尼氏症候群（Carney-Stratakis syndrome）"},"pages":[12],"images":["assets/115020_308_0107/page-12.jpg"],"hasImages":false,"id":"115020_308_0107:63","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":64,"stem":"下列何者是風濕性心臟病最常見之原因？","options":{"A":"A 群β溶血型鏈球菌感染","B":"自體抗體攻擊內皮細胞基底膜","C":"冠狀動脈血管炎","D":"肺部血管高壓"},"pages":[12,13],"images":["assets/115020_308_0107/page-12.jpg","assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:64","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":65,"stem":"有關甲狀腺機能低下（hypothyroidism）之成因，下列何者錯誤？","options":{"A":"甲狀腺全切除（total thyroidectomy）","B":"葛瑞夫茲氏病（Graves disease）","C":"橋本氏甲狀腺炎（Hashimoto thyroiditis）","D":"腦下垂體功能低下（hypopituitarism）"},"pages":[13],"images":["assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:65","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":66,"stem":"乳癌的重要生物標記（biomarkers）包括：雌激素受體（estrogen receptor, ER）、黃體素受體\n（progesterone receptor, PR）及人類表皮生長因子受體（human epidermal growth factor receptor 2, \nHER2）等。在相同的期別（stage）下，乳癌細胞表現出下列那種組合的生物標記其預後（prognosis）相對\n最差？","options":{"A":"ER(＋)、PR(＋)、HER2(－)","B":"ER(＋)、PR(＋)、HER2(＋)","C":"ER(＋)、PR(－)、HER2(＋)","D":"ER(－)、PR(－)、HER2(－)"},"pages":[13],"images":["assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:66","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":67,"stem":"有關急性呼吸窘迫症候群（acute respiratory distress syndrome, ARDS）的敘述，下列何者錯誤？","options":{"A":"成因是急性瀰漫性肺泡損害，肺泡微血管通透性增加，造成肺水腫及呼吸窘迫","B":"臨床表現為呼吸衰竭、動脈血氣分壓過低","C":"造成的原因為休克、吸入胃酸、溺水、嚴重感染等","D":"病理觀察到的玻璃膜（hyaline membrane）主要堆積在肺微血管壁上"},"pages":[13],"images":["assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:67","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":68,"stem":"下列何者不屬於肺癌的副贅瘤症候群（paraneoplastic syndrome）？","options":{"A":"高血鈣症","B":"庫欣氏症候群（Cushing syndrome）","C":"上腔靜脈症候群（SVC syndrome）","D":"重症肌無力症候群（myasthenia syndrome）"},"pages":[13],"images":["assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:68","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":69,"stem":"有關子宮內膜的漿液性癌（serous carcinoma of endometrium），下列敘述何者最適當？","options":{"A":"前驅病灶為子宮內膜增生（endometrial hyperplasia）","B":"常見PTEN基因突變","C":"預後優於子宮內膜之內膜樣癌（endometrioid carcinoma）","D":"常見有TP53基因突變"},"pages":[13],"images":["assets/115020_308_0107/page-13.jpg"],"hasImages":false,"id":"115020_308_0107:69","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":70,"stem":"有關卵巢之畸胎瘤（teratoma）的敘述，下列何者正確？","options":{"A":"多發生於更年期婦女","B":"以雙側居多","C":"大多為良性","D":"惡性轉變以腺癌（adenocarcinoma）居多"},"pages":[13,14],"images":["assets/115020_308_0107/page-13.jpg","assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:70","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":71,"stem":"有關 Peutz-Jeghers 症候群（Peutz-Jeghers syndrome），下列何者正確？","options":{"A":"典型的結腸息肉是無蒂鋸齒狀腺瘤（sessile serrated adenoma）","B":"STK11基因突變","C":"體染色體隱性遺傳","D":"皮膚黏膜色素減退（hypopigmentation）"},"pages":[14],"images":["assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:71","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":72,"stem":"有關原發性膽汁性膽管炎（primary biliary cholangitis, PBC）的敘述，下列何者錯誤？","options":{"A":"主要是肝外和肝內大型膽管的發炎破壞","B":"常出現針對 PDC-E2（E2 component of the pyruvate dehydrogenase complex）的自體抗體","C":"常出現淋巴球或肉芽腫性膽管破壞","D":"常出現 T 淋巴細胞介導對膽管的攻擊"},"pages":[14],"images":["assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:72","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":73,"stem":"第二型自體免疫性肝炎（type 2 autoimmune hepatitis）多見於兒童，下列何者並非此疾病特徵性之自體抗\n體？","options":{"A":"抗肝腎微粒體-1 抗體（anti-liver kidney microsome-1, LKM-1 antibody）","B":"抗 CYP2D6 抗體（anti-CYP2D6 antibody）","C":"抗肝細胞質-1 抗體（anti-liver cytosol-1, ALC-1 antibody）","D":"抗粒線體抗體（anti-mitochondrial antibody, AMA）"},"pages":[14],"images":["assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:73","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":74,"stem":"有關腦部創傷（brain trauma）的敘述，下列何者正確？","options":{"A":"外傷造成橋靜脈斷裂是硬網膜上出血（epidural hematoma）最常見的原因","B":"先天性囊狀動脈瘤（saccular aneurysm）常是腦部外傷引起","C":"蜘蛛膜出血通常是中腦膜動脈斷裂而造成","D":"腦部底部是容易有撕裂傷（laceration）的位置"},"pages":[14],"images":["assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:74","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":75,"stem":"腦脊髓液中之隱球菌（cryptococcus）最常利用下列何種染色方法觀察其多醣體莢膜（polysaccharide \ncapsule）？","options":{"A":"India ink stain","B":"Sudan black stain","C":"Masson trichrome stain","D":"Prussian blue stain"},"pages":[14],"images":["assets/115020_308_0107/page-14.jpg"],"hasImages":false,"id":"115020_308_0107:75","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":76,"stem":"有關骨質疏鬆（osteoporosis）的各種成因與機轉，下列敘述何者最不適當？","options":{"A":"停經後婦女的骨質疏鬆主因為 progesterone 分泌減少","B":"老年人的成骨細胞（osteoblast）功能下降，減少成骨作用","C":"鈣質代謝異常，包括鈣質缺乏，副甲狀腺分泌過多，維生素 D 缺乏","D":"細胞激素（cytokine）異常，導致蝕骨細胞（osteoclast）活化"},"pages":[14,15],"images":["assets/115020_308_0107/page-14.jpg","assets/115020_308_0107/page-15.jpg"],"hasImages":false,"id":"115020_308_0107:76","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":77,"stem":"有關微小變化腎病（minimal change disease），下列敘述何者正確？①為小孩最常見的腎病症候群\n（nephrotic syndrome）原因 ②常可見到免疫複合體（immune complex）沉積 ③相對於大人而言，小孩\n對類固醇治療反應會較快 ④此類病人常出現血尿","options":{"A":"①④","B":"①②③","C":"②④","D":"僅①③"},"pages":[15],"images":["assets/115020_308_0107/page-15.jpg"],"hasImages":false,"id":"115020_308_0107:77","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":78,"stem":"下列何種肝炎病毒傳染途徑以糞口傳染為主？","options":{"A":"hepatitis B virus","B":"hepatitis C virus","C":"hepatitis D virus","D":"hepatitis E virus"},"pages":[15],"images":["assets/115020_308_0107/page-15.jpg"],"hasImages":false,"id":"115020_308_0107:78","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":79,"stem":"25 歲男性，有癲癇病史，突發劇烈頭痛後陷入昏迷。影像檢查顯示腦內大片出血合併腦室內出血。下列何者\n最可能是其腦出血的原因？","options":{"A":"高血壓性腦血管病變（hypertensive cerebrovascular disease）","B":"血栓性腦血管栓塞（embolic cerebral infarction）","C":"動靜脈畸形（arteriovenous malformation）","D":"大腦澱粉樣血管病變（cerebral amyloid angiopathy）"},"pages":[15],"images":["assets/115020_308_0107/page-15.jpg"],"hasImages":false,"id":"115020_308_0107:79","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":80,"stem":"下列病灶何者不是主要源自於關節相關組織（如 synovium、joint capsule、tendon sheath）？","options":{"A":"Baker 氏囊腫（Baker cyst）","B":"滑液囊肉瘤（synovial sarcoma）","C":"肌腱滑膜巨細胞瘤（tenosynovial giant cell tumor）","D":"腱鞘囊腫（ganglion）"},"pages":[15],"images":["assets/115020_308_0107/page-15.jpg"],"hasImages":false,"id":"115020_308_0107:80","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}}],"pageCount":15,"imageOnlyPages":[],"id":"115020_308_0107","description":"臨床生理學與病理學","answerSource":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=S&code=115020&c=308&s=0107&q=1","correctionSource":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=M&code=115020&c=308&s=0107&q=1"},{"title":"臨床血液學與血庫學","fullTitle":"臨床血液學與血庫學","exam":"第一次考試","category":"高等考試_醫事檢驗師","minutes":60,"source":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=Q&code=115020&c=308&s=0501&q=1","questions":[{"number":1,"stem":"下列何者的 erythroblast 會因 DNA 合成障礙，導致細胞核與細胞質不同步成熟的貧血症？","options":{"A":"巨紅芽球性貧血（megaloblastic anemia ）","B":"鐵芽球性貧血（sideroblastic anemia ）","C":"乙型海洋性貧血（β-thalassemia minor ）","D":"G6PD 缺乏之溶血性貧血（G6PD deficient hemolytic anemia ）"},"pages":[1],"images":["assets/115020_308_0501/page-01.jpg"],"hasImages":false,"id":"115020_308_0501:1","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":2,"stem":"有關原紫質（protoporphyrin）參與血色素合成的敘述，下列何者錯誤？","options":{"A":"原紫質與鐵組裝成 heme 是由 heme synthase 負責完成","B":"原紫質合成由 glycine 及 succinyl CoA 開始","C":"原紫質合成需 Vit. B 6 參與","D":"原紫質與鐵組裝成 heme 是在 ribosome 完成"},"pages":[1],"images":["assets/115020_308_0501/page-01.jpg"],"hasImages":false,"id":"115020_308_0501:2","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":3,"stem":"某貧血病患的 MCV 與 MCH 結果如下，何者最符合 microcytic hypochromic anemia ？","options":{"A":"MCV 70 fL ／MCH 21 pg","B":"MCV 85 fL ／MCH 32 pg","C":"MCV 95 fL ／MCH 35 pg","D":"MCV 105 fL ／MCH 37 pg"},"pages":[1],"images":["assets/115020_308_0501/page-01.jpg"],"hasImages":false,"id":"115020_308_0501:3","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":4,"stem":"有關惡性貧血（pernicious anemia ）的敘述，下列何者正確？","options":{"A":"anti-proton pump H\n+\n/K\n+\n‐ATPase 自體抗體陽性，則可以作為惡性貧血的專一性診斷","B":"罹患惡性貧血的比率男多於女","C":"惡性貧血主因是嚴重缺乏葉酸","D":"幽門螺旋桿菌（H. pylori ）是引起老年人惡性貧血的原因之一"},"pages":[1],"images":["assets/115020_308_0501/page-01.jpg"],"hasImages":false,"id":"115020_308_0501:4","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":5,"stem":"下列各物質何者會因為缺乏葉酸而增加？","options":{"A":"s-adenoyl homocysteine","B":"homocysteine","C":"methionine","D":"deoxythymidine monophosphate （dTMP）"},"pages":[1,2],"images":["assets/115020_308_0501/page-01.jpg","assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:5","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":6,"stem":"下列何者與嚴重缺乏維生素 B12 最無關？","options":{"A":"全素食者","B":"肝臟疾病","C":"部分胃切除","D":"部分迴腸（ileum）切除"},"pages":[2],"images":["assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:6","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":7,"stem":"有關丙酮酸激酶缺乏症（pyruvate kinase deficiency）的敘述，下列何者正確？","options":{"A":"細胞內 2,3-diphosphoglycerate（2,3-DPG）大量減少","B":"常見於 X 染色體隱性遺傳","C":"與 NADPH 供應異常有關","D":"紅血球 ATP 減少"},"pages":[2],"images":["assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:7","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":8,"stem":"鐮刀型紅血球貧血症（sickle cell anemia ），最主要是因血色素β鏈第 6 個胺基酸產生下列那種突變？","options":{"A":"由纈胺酸（valine）變成酪胺酸（tyrosine）","B":"由酪胺酸（tyrosine）變成天門冬胺酸（aspartic acid ）","C":"由天門冬胺酸（aspartic acid ）變成麩胺酸（glutamic acid ）","D":"由麩胺酸（glutamic acid ）變成由纈胺酸（valine）"},"pages":[2],"images":["assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:8","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":9,"stem":"有關遺傳性球狀紅血球增多症（hereditary spherocytosis ），下列敘述何者最不適當？","options":{"A":"通常是紅血球細胞膜之 membrane skeleton 結構蛋白質的異常所造成","B":"血清中的 lactate dehydrogenase 減少","C":"尿液中的 urobilinogen 增加","D":"血清中的 haptoglobin 減少"},"pages":[2],"images":["assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:9","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":10,"stem":"有關 paroxysmal nocturnal hemoglobinuria （PNH）的敘述，下列何者最不適當？","options":{"A":"紅血球細胞膜上的 membrane inhibitor of reactive lysis （MIRL, CD59 ）含量增加","B":"紅血球細胞膜蛋白質 glycosylphosphatidylinositol（GPI）anchor 異常","C":"紅血球細胞膜上的 CD55 下降，導致無法抑制補體活化反應","D":"血清中 lactate dehydrogenase 增加"},"pages":[2],"images":["assets/115020_308_0501/page-02.jpg"],"hasImages":false,"id":"115020_308_0501:10","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":11,"stem":"有關骨髓中 myeloid：erythroid 的細胞比例變化，下列何者最有可能是 hereditary spherocytosis 病人的\n骨髓檢查結果？","options":{"A":"10：1","B":"6：1","C":"3：1","D":"1：2"},"pages":[2,3],"images":["assets/115020_308_0501/page-02.jpg","assets/115020_308_0501/page-03.jpg"],"hasImages":true,"id":"115020_308_0501:11","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":12,"stem":"下列何種血色素蛋白表現的切換是發生在出生後 3～6 個月？","options":{"A":"ζ切換成α","B":"ε切換成γ","C":"ε切換成β","D":"γ切換成β"},"pages":[3],"images":["assets/115020_308_0501/page-03.jpg"],"hasImages":true,"id":"115020_308_0501:12","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":13,"stem":"下列何種疾病可以用淋巴球端粒長度作為診斷工具？","options":{"A":"Shwachman-Diamond syndrome","B":"Chediak-Higashi syndrome","C":"dyskeratosis congenita","D":"paroxysmal nocturnal hemoglobinuria"},"pages":[3],"images":["assets/115020_308_0501/page-03.jpg"],"hasImages":true,"id":"115020_308_0501:13","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":14,"stem":"有關 vitamin B 12 的敘述，下列何者最不適當？","options":{"A":"intrinsic factor 結合的 vitamin B 12 在 ileum 進入肝門靜脈","B":"在血漿中 vitamin B 12 不會與 transcobalamin II 結合","C":"血漿中與 haptocorrin 結合的 vitamin B 12 不會運送到骨髓","D":"在 myeloproliferative neoplasm 的病人血液中有大量的 vitamin B 12"},"pages":[3],"images":["assets/115020_308_0501/page-03.jpg"],"hasImages":true,"id":"115020_308_0501:14","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":15,"stem":"病人檢體的紅血球計數如圖所示，則下列何者最符合病人的狀況？","options":{"A":"缺鐵性貧血病人接受口服鐵劑治療","B":"β-thalassemia trait 病人接受葉酸治療","C":"α-thalassemia 病人接受葉酸治療","D":"megaloblastic anemia 病人接受 Vit. B 12 治療"},"pages":[3],"images":["assets/115020_308_0501/page-03.jpg"],"hasImages":true,"id":"115020_308_0501:15","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""} tion-restriction fragment length polymorphism（PCR-RFLP）","B":"probe hybridization","C":"Sanger sequencing","D":"reverse transcription-polymerase chain reaction（RT-PCR）"},"pages":[10],"images":["assets/115020_308_0502/page-10.jpg"],"hasImages":true,"id":"115020_308_0502:52","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":53,"stem":"關於光引導原位合成法（light-directed synthesis）之 DNA晶片，下列敘述何者最正確？","options":{"A":"DNA 晶片是將已經標定螢光的DNA探針固定於矽晶片（silicon）","B":"在合成 DNA探針時，只能知道探針的序列，但無法設定探針在矽晶片上的位置","C":"DNA 晶片上的探針長度大多介於 20～25 個核苷酸","D":"DNA 晶片只能偵測基因變異，無法用來檢測基因表達量的差別"},"pages":[10],"images":["assets/115020_308_0502/page-10.jpg"],"hasImages":true,"id":"115020_308_0502:53","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":54,"stem":"關於增幅阻礙突變系統（amplification refractory mutation system, ARMS）的敘述，下列何者最不適\n當？","options":{"A":"可偵測任何單一核苷酸點突變（point mutation）","B":"可偵測小基因片段的剔除突變（small deletion mutation）","C":"這檢驗方法侷限於已知突變的偵測","D":"需要設計具有限制酶位點序列的引子"},"pages":[10,11],"images":["assets/115020_308_0502/page-10.jpg","assets/115020_308_0502/page-11.jpg"],"hasImages":true,"id":"115020_308_0502:54","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":55,"stem":"關於變性梯度膠體電泳法（denaturing gradient gel electrophoresis, DGGE），下列敘述何者正確？","options":{"A":"隨著變性劑濃度增加，DNA開始解離形成單股，而增加移動速率","B":"欲分析之DNA 分子的Tm較低時，其解析力較佳","C":"欲決定出變性劑的最佳使用濃度範圍，宜使用電泳方向與變性劑梯度垂直的電泳方式","D":"電泳操作之溫度需隨變性劑濃度增加而增加"},"pages":[11],"images":["assets/115020_308_0502/page-11.jpg"],"hasImages":false,"id":"115020_308_0502:55","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":56,"stem":"關於次世代定序及傳統桑格定序的方法之敘述，下列何者最正確？","options":{"A":"兩者皆需建立文庫（library）","B":"就單一片段而言，桑格定序讀長較次世代定序長","C":"就每個鹼基而言，次世代定序費用較桑格定序高","D":"就資料分析而言，桑格定序較次世代定序複雜"},"pages":[11],"images":["assets/115020_308_0502/page-11.jpg"],"hasImages":false,"id":"115020_308_0502:56","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":57,"stem":"序列特異性引子檢驗法（sequence specific primer-PCR）與特異性寡核苷酸試紙法（sequence specific \noligonucleotide strip）常用於檢測HLA等位基因，關於此兩種檢測法的比較，下列敘述何者最不適當？","options":{"A":"序列特異性引子檢驗法所需檢測的時間較短","B":"序列特異性引子檢驗法可用於直接鑑別未知的 HLA等位基因","C":"相較於序列特異性引子檢驗法，特異性寡核苷酸試紙法需要人工操作的步驟較少","D":"此兩種檢測法皆需要positive control組"},"pages":[11],"images":["assets/115020_308_0502/page-11.jpg"],"hasImages":false,"id":"115020_308_0502:57","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":58,"stem":"下列何種抗凝血劑的血液檢體，最適用於DNA 分子檢驗？","options":{"A":"EDTA","B":"sodium fluoride","C":"heparin","D":"sodium oxalate"},"pages":[11],"images":["assets/115020_308_0502/page-11.jpg"],"hasImages":false,"id":"115020_308_0502:58","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":59,"stem":"關於純化的RNA核酸，下列敘述何者最不適當？","options":{"A":"應使用無菌且以diethylpyrocarbonate（DEPC）水處理過之容器儲存","B":"不適合在-20℃冰櫃中保存，因為仍有RNase存在，可能降解 RNA","C":"最好保存在-70℃或更低溫度的冰櫃","D":"即使經常使用，也不需分裝，以節省空間並避免RNA降解"},"pages":[11],"images":["assets/115020_308_0502/page-11.jpg"],"hasImages":false,"id":"115020_308_0502:59","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":60,"stem":"關於分生實驗室的敘述，下列何者最不適當？","options":{"A":"微量吸管應使用有filter的 tip，防止受到擴增後核酸的污染","B":"試劑配製與核酸萃取的空間最好分開區隔","C":"PCR 儀器建議擺放在postamplification room","D":"preamplification room應該設計為負壓，postamplification room則應該設計為正壓"},"pages":[11,12],"images":["assets/115020_308_0502/page-11.jpg","assets/115020_308_0502/page-12.jpg"],"hasImages":false,"id":"115020_308_0502:60","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":61,"stem":"基因註解（annotation）是次世代定序結果判讀中重要的一環，下列何者為進行 exam/wHandExamQandA_File.ashx?t=Q&code=115020&c=308&s=0504&q=1","questions":[{"number":1,"stem":"以簡單的脈搏血氧測定法（simple pulse oximetry）測定血氧飽和度（SO2）時，是屬於下列那一種偵測分析\n方法？","options":{"A":"分光光度法（spectrophotometry）","B":"紙色層分析法（paper chromatography）","C":"電內滲流方法（electroendosmotic flow method）","D":"離子選擇電極方法（ion-selective electrode method）"},"pages":[1],"images":["assets/115020_308_0504/page-01.jpg"],"hasImages":false,"id":"115020_308_0504:1","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":2,"stem":"下列何種免疫分析法屬於異質性分析（heterogeneous immunoassay）？","options":{"A":"cloned enzyme donor immunoassay（CEDIA）","B":"enzyme-linked immunosorbent assay（ELISA）","C":"enzyme multiplied immunoassay technique（EMIT）","D":"fluorescence polarization immunoassay（FPIA）"},"pages":[1],"images":["assets/115020_308_0504/page-01.jpg"],"hasImages":false,"id":"115020_308_0504:2","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":3,"stem":"下列那一個染劑，較不適合用於血清蛋白電泳（serum protein electrophoresis）分析？","options":{"A":"醯胺黑染劑（Amido Black）","B":"考馬斯亮藍染劑（Coomassie brilliant blue）","C":"麗春紅染劑（Ponceau S）","D":"蘇丹黑 B染劑（Sudan Black B）"},"pages":[1],"images":["assets/115020_308_0504/page-01.jpg"],"hasImages":false,"id":"115020_308_0504:3","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":4,"stem":"有關檢體的保存、運送和儲存處置條件，下列何者最不適當？","options":{"A":"可使用未過期的檢體進行附加檢測（add-on request）","B":"檢測丙酮酸、胃泌素和腎素的檢體須冰浴運送","C":"離心時血液檢體接觸空氣會造成 CO2下降、O2上升和pH 上升","D":"血液檢體若無法在2 小時內進行離心時，應放置於 4℃"},"pages":[1],"images":["assets/115020_308_0504/page-01.jpg"],"hasImages":false,"id":"115020_308_0504:4","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":5,"stem":"以質譜儀分析蛋白質需要用到電噴灑游離法（electrospray ionization, ESI）與基質輔助雷射脫附游離法\n（matrix-assisted laser desorption/ionization, MALDI），兩 _0103:54","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":55,"stem":"下列何種人體的基因型樣不會產生器官移植排斥？","options":{"A":"異卵雙胞胎","B":"變卵雙胞胎","C":"同卵雙胞胎","D":"多卵雙胞胎"},"pages":[11],"images":["assets/115090_308_0103/page-11.jpg"],"hasImages":false,"id":"115090_308_0103:55","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":56,"stem":"下列何種疾病與抗著絲粒抗體（anti-centromere antibody）最相關？","options":{"A":"全身性硬化症（systemic sclerosis）","B":"修格連氏症候群（Sjögren syndrome）","C":"類風濕性關節炎（rheumatoid arthritis）","D":"全身性紅斑性狼瘡（systemic lupus erythematosus）"},"pages":[11],"images":["assets/115090_308_0103/page-11.jpg"],"hasImages":false,"id":"115090_308_0103:56","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":57,"stem":"下列何項血液疾病可以在腫瘤細胞內看到奧爾氏桿（Auer rod）？","options":{"A":"急性淋巴球性白血病（acute lymphoblastic leukemia, ALL）","B":"慢性淋巴球性白血病（chronic lymphoblastic leukemia, CLL）","C":"急性骨髓細胞性白血病（acute myeloid leukemia, AML）","D":"毛細胞白血病（hairy cell leukemia）"},"pages":[11],"images":["assets/115090_308_0103/page-11.jpg"],"hasImages":false,"id":"115090_308_0103:57","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":58,"stem":"下列何者並不是引起肺心症（cor pulmonale）常見的原因？","options":{"A":"肺氣腫（emphysema）","B":"肺栓塞（pulmonary embolism）","C":"慢性支氣管炎（chronic bronchitis）","D":"一氧化碳中毒"},"pages":[11],"images":["assets/115090_308_0103/page-11.jpg"],"hasImages":false,"id":"115090_308_0103:58","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":59,"stem":"冠狀動脈血管炎是下列何種疾病的特徵？","options":{"A":"川崎氏症（Kawasaki disease）","B":"結節性多動脈炎（polyarteritis nodosa）","C":"巨細胞血管炎（giant cell arteritis）","D":"過敏性肉芽腫血管炎（eosinophilic granulomatosis with polyangiitis）"},"pages":[11,12],"images":["assets/115090_308_0103/pag neumoconiosis），下列敘述何者錯誤？","options":{"A":"矽、炭末、石綿均可引起肺塵埃沉著症","B":"常與職業接觸相關","C":"病理主要是巨噬細胞及纖維母細胞形成的肺結節，好發肺上葉","D":"臨床上與胸膜間皮瘤高度相關"},"pages":[12,13],"images":["assets/115090_308_0103/page-12.jpg","assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:64","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":65,"stem":"下列何者造成的胸膜腔滲液（effusions）性質與其他三者不同？","options":{"A":"鬱血性心衰竭","B":"腎病症候群","C":"肺部感染","D":"肝硬化"},"pages":[13],"images":["assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:65","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":66,"stem":"有關慢性阻塞性肺病（chronic obstructive pulmonary disease, COPD），下列敘述何者正確？","options":{"A":"可以是單純慢性支氣管炎或肺氣腫，又或是同時併有此兩種變化","B":"慢性阻塞性肺病是可逆性的疾病","C":"慢性支氣管炎的臨床定義是連續兩年以上、每年至少連續半年以上大部分時間有持續帶痰的咳嗽","D":"慢性支氣管炎的病理變化主要是肺泡及氣室不正常的擴大現象"},"pages":[13],"images":["assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:66","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":67,"stem":"惡性貧血（pernicious anemia）主要是因缺乏下列那種營養素所導致？","options":{"A":"葉酸","B":"鐵質","C":"維生素 B12","D":"鈣"},"pages":[13],"images":["assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:67","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":68,"stem":"有關 Graves氏病，下列何者正確？","options":{"A":"為甲狀腺腺瘤（adenoma of the thyroid）","B":"為結節性甲狀腺腫（nodular goiter）","C":"為自體免疫甲狀腺疾病（autoimmune thyroid disease）","D":"為亞急性甲狀腺炎（subacute thyroiditis）"},"pages":[13],"images":["assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:68","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":69,"stem":"心肌梗塞最常見於冠狀動脈出現下列何種情形？","options":{"A":"血栓（thrombosis）","B":"脂肪栓塞（fat embolism）","C":"動脈瘤（aneurysm）","D":"血管痙攣（vasospasm）"},"pages":[13],"images":["assets/115090_308_0103/page-13.jpg"],"hasImages":false,"id":"115090_308_0103:69","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":70,"stem":"有關 A 型肝炎病毒（hepatitis A virus）感染，下列敘述何者錯誤？","options":{"A":"潛伏期約2～6 週","B":"大多數患者在3個月內康復","C":"約 2％～3％的患者出現急性肝衰竭","D":"不會導致慢性肝炎"},"pages":[13,14],"images":["assets/115090_308_0103/page-13.jpg","assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:70","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":71,"stem":"有關自體免疫性萎縮性胃炎（autoimmune atrophic gastritis）的敘述，下列何者錯誤？","options":{"A":"常伴隨維生素 B12缺乏","B":"有 H\n+\n, K\n+\n-ATP 酶（H\n+\n, K\n+\n-ATPase）自體抗體的存在","C":"血清胃蛋白酶原一型（pepsinogen I）濃度增加","D":"內分泌細胞增生（endocrine cell hyperplasia）"},"pages":[14],"images":["assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:71","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":72,"stem":"當腦部組織受到損傷後，下列何者為負責腦部組織修復的主要細胞？","options":{"A":"腦室細胞（ependymal cell）","B":"寡樹突細胞（oligodendrocyte）","C":"星狀細胞（astrocyte）","D":"神經元細胞（neuron）"},"pages":[14],"images":["assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:72","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":73,"stem":"有關骨關節炎（osteoarthritis）的敘述，下列何者較不適當？","options":{"A":"膝關節是常見的部位","B":"可造成關節周遭骨骼退化性病變","C":"主要成因為關節軟骨反覆承受生物力學壓力","D":"其實為退化性疾病，發炎並無角色"},"pages":[14],"images":["assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:73","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":74,"stem":"有關骨質石化病（osteopetrosis），下列敘述何者錯誤？","options":{"A":"蝕骨細胞（osteoclast）之形成或功能不足","B":"常因基因變異而致，可以是顯性或隱性遺傳性疾病","C":"臨床表現為骨質密度極高、堅硬、沉重而不易骨折","D":"影響造血功能而導致免疫力不足，是重要死因"},"pages":[14],"images":["assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:74","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":75,"stem":"下列何種骨及軟組織腫瘤，具有較複雜的染色體核型（karyotype）？","options":{"A":"未分化多形性肉瘤（undifferentiated pleomorphic sarcoma）","B":"肺泡樣橫紋肌肉瘤（alveolar rhabdomyosarcoma）","C":"尤汶氏肉瘤（Ewing sarcoma）","D":"骨母細胞瘤（osteoblastoma）"},"pages":[14],"images":["assets/115090_308_0103/page-14.jpg"],"hasImages":false,"id":"115090_308_0103:75","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":76,"stem":"下列何者非腎病症候群（nephrotic syndrome）的特點？","options":{"A":"蛋白尿（proteinuria）","B":"高血脂症（hyperlipidemia）","C":"全身水腫（generalized edema）","D":"血尿（hematuria）"},"pages":[14,15],"images":["assets/115090_308_0103/page-14.jpg","assets/115090_308_0103/page-15.jpg"],"hasImages":false,"id":"115090_308_0103:76","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":77,"stem":"下列何種情況會造成瀰漫性肝細胞的小泡型脂肪變化（diffuse microvesicular fatty change）？","options":{"A":"口服避孕藥","B":"雷伊綜合症（Reye syndrome）","C":"乙醇（ethanol）","D":"類固醇（corticosteroids）"},"pages":[15],"images":["assets/115090_308_0103/page-15.jpg"],"hasImages":false,"id":"115090_308_0103:77","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":78,"stem":"有關骨髓炎（osteomyelitis）的敘述，下列何者錯誤？","options":{"A":"化膿性骨髓炎最常被培養出來的致病原是化膿性鏈球菌（Streptococcus pyogenes）","B":"急性骨髓炎可以進展成慢性骨髓炎，並反覆急性發作","C":"慢性骨髓炎之併發症包括骨折、敗血症以及附近組織之鱗狀細胞癌（squamous cell carcinoma）","D":"結核菌造成之骨髓炎約4成發生在脊椎"},"pages":[15],"images":["assets/115090_308_0103/page-15.jpg"],"hasImages":false,"id":"115090_308_0103:78","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":79,"stem":"有關髓母細胞瘤（medulloblastoma）的敘述，下列何者錯誤？","options":{"A":"好發在小孩的小腦中線","B":"在病理分類上是一種胚胎性腫瘤（embryonal neoplasm），由小藍細胞（small blue cells）組成","C":"屬於高度惡性之腫瘤，但是對放射治療反應很好","D":"不同分子變異的種類預後不同，基因突變發生於Wnt路徑的種類是預後最差的一種"},"pages":[15],"images":["assets/115090_308_0103/page-15.jpg"],"hasImages":false,"id":"115090_308_0103:79","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":80,"stem":"下列何種膀胱腫瘤之細胞，較不易於尿液細胞學檢查中清楚辨識？","options":{"A":"低惡性度乳突泌尿上皮癌（papillary urothelial carcinoma, low grade）","B":"高惡性度乳突泌尿上皮癌（papillary urothelial carcinoma, high grade）","C":"泌尿上皮原位癌（urothelial carcinoma in situ）","D":"侵襲性泌尿上皮癌（invasive urothelial carcinoma）"},"pages":[15],"images":["assets/115090_308_0103/page-15.jpg"],"hasImages":false,"id":"115090_308_0103:80","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}}],"pageCount":15,"imageOnlyPages":[],"id":"115090_308_0103","description":"臨床生理學與病理學","answerSource":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=S&code=115090&c=308&s=0103&q=1","correctionSource":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=M&code=115090&c=308&s=0103&q=1"},{"title":"臨床血液學與血庫學","fullTitle":"臨床血液學與血庫學","exam":"第二次考試","category":"高等考試_醫事檢驗師","minutes":60,"source":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=Q&code=115090&c=308&s=0501&q=1","questions":[{"number":1,"stem":"有關葉酸衍生物5,10-methylene THF參與DNA合成的過程，下列何者為此反應步驟的最主要產物？","options":{"A":"dAMP","B":"dTMP","C":"dGMP","D":"dCMP"},"pages":[1],"images":["assets/115090_308_0501/page-01.jpg"],"hasImages":false,"id":"115090_308_0501:1","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":2,"stem":"下列何者是多發性骨髓瘤最常見的異常細胞？","options":{"A":"漿細胞","B":"T 細胞","C":"纖維母細胞","D":"成骨細胞"},"pages":[1],"images":["assets/115090_308_0501/page-01.jpg"],"hasImages":false,"id":"115090_308_0501:2","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":3,"stem":"下列何種血液疾病最容易出現單株抗體製造異常增加？","options":{"A":"感染性單核球增多症","B":"多發性骨髓瘤","C":"急性淋巴性白血病","D":"慢性骨髓性白血病"},"pages":[1],"images":["assets/115090_308_0501/page-01.jpg"],"hasImages":false,"id":"115090_308_0501:3","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":4,"stem":"某骨髓分化不良症候群（myelodysplastic syndrome, MDS）病患檢查結果只發現chromosome 5q deletion的\n染色體變異，則該病患的預後為何？","options":{"A":"good","B":"intermediate","C":"poor","D":"very poor"},"pages":[1],"images":["assets/115090_308_0501/page-01.jpg"],"hasImages":false,"id":"115090_308_0501:4","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":5,"stem":"有關鐮細胞貧血症（sickle cell anemia）的血色素突變，下列何者為最常見？","options":{"A":"β鏈的第6個位置麩胺酸（glutamic acid）被纈胺酸（valine）取代","B":"β鏈的第26 個位置麩胺酸（glutamic acid）被纈胺酸（valine）取代","C":"α鏈的第6個位置麩胺酸（glutamic acid）被纈胺酸（valine）取代","D":"α鏈的第26 個位置麩胺酸（glutamic acid）被纈胺酸（valine）取代"},"pages":[1,2],"images":["assets/115090_308_0501/page-01.jpg","assets/115090_308_0501/page-02.jpg"],"hasImages":false,"id":"115090_308_0501:5","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":6,"stem":"有關缺鐵性貧血的檢驗結果，下列敘述何者錯誤？","options":{"A":"網狀紅血球（reticulocyte）數量通常下降","B":"血小板數量通常下降","C":"total iron binding capacity（TIBC）通常上升","D":"血清 ferritin通常下降"},"pages":[2],"images":["assets/115090_308_0501/page-02.jpg"],"hasImages":false,"id":"115090_308_0501:6","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":7,"stem":"有關維生素 B12的吸收與運送過程，下列敘述何者錯誤？","options":{"A":"食物中釋放出來的維生素 B12可與 haptocorrin結合","B":"維生素 B12主要在迴腸（ileum）被吸收進入體內","C":"血液中維生素 B12的主要結構是deoxyadenosyl-cobalamin","D":"血液中與transcobalamin II結合的維生素 B12可以被送入骨髓中利用"},"pages":[2],"images":["assets/11509 options":{"A":"增加 DNA負電荷","B":"使 DNA 更易進行變性","C":"活化限制酶切位點","D":"增加探針進行雜交反應的專一性"},"pages":[11],"images":["assets/115090_308_0502/page-11.jpg"],"hasImages":false,"id":"115090_308_0502:52","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":53,"stem":"關於 PCR-ARMS技術的敘述，下列何者最不適當？","options":{"A":"變異點設計在引子的 5'端核苷酸","B":"此方法僅限於檢測已知的變異點","C":"藉由引子的設計，可使野生型與變異型之產物長度不同","D":"產物可以利用凝膠（agarose）或聚丙烯醯胺凝膠（polyacrylamide gel）分析"},"pages":[11],"images":["assets/115090_308_0502/page-11.jpg"],"hasImages":false,"id":"115090_308_0502:53","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":54,"stem":"PCR 是核酸放大的基本技術，要進行此技術，需要DNA template、primers、nucleotides、polymerase及反\n應緩衝液。其中，緩衝液中的那個成分對於將primer雜合（hybridize）到DNA template之反應條件的優化\n最重要？","options":{"A":"KCl","B":"Tris","C":"MgCl2","D":"ZnCl2"},"pages":[11],"images":["assets/115090_308_0502/page-11.jpg"],"hasImages":false,"id":"115090_308_0502:54","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":55,"stem":"下列何種病原菌的PCR陽性最需謹慎判讀，因健康人（尤其兒童）亦可能見到其定殖（colonization）？","options":{"A":"Neisseria gonorrhoeae","B":"Listeria monocytogenes","C":"Chlamydophila pneumoniae","D":"Streptococcus pneumoniae"},"pages":[11],"images":["assets/115090_308_0502/page-11.jpg"],"hasImages":false,"id":"115090_308_0502:55","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":56,"stem":"相較於高通量全基因體定序法，使用聚合酶連鎖反應相關方法進行細菌分型（PCR-based typing method）的\n敘述，下列何者最不適當？","options":{"A":"起始檢體需求量較少","B":"結果具較高專一性與敏感性","C":"所需的硬體與技術門檻較低","D":"檢驗的周轉時間（turnaround time）較短"},"pages":[11],"images":["assets/115090_308_0502/page-11.jpg"],"hasImages":false,"id":"115090_308_0502:56","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":57,"stem":"下列何者不是偵測 鹼基","D":"因為引子特殊設計，能更精準分辨正常基因與突變基因"},"pages":[13],"images":["assets/115090_308_0502/page-13.jpg"],"hasImages":false,"id":"115090_308_0502:66","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":67,"stem":"Phred Quality score（Q score）可用來評估次世代定序的鹼基品質，Q30所表示的鹼基定序錯誤概率為\n何？","options":{"A":"1/10","B":"1/100","C":"1/1000","D":"1/10000"},"pages":[13],"images":["assets/115090_308_0502/page-13.jpg"],"hasImages":false,"id":"115090_308_0502:67","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":68,"stem":"某實驗室啟動非侵入性產前基因檢測（Non-Invasive Prenatal Gene Test, NIPT）檢驗服務之敘述，下列何\n者最不適當？","options":{"A":"此檢體之採集方式雖由受檢者自行到抽血櫃檯接受抽血，仍需額外簽署知情同意（informed consent）文件","B":"採集的檢體為懷孕者的血液檢體，一般使用的採檢容器為實驗室最常見的綠頭管（Lithium Heparin試管）","C":"NIPT 檢測標的若為基因體DNA（genomic DNA），可使用血漿檢體萃取核酸","D":"檢體採集後，核酸萃取前的暫存條件，包括溫度與時間，需由實驗室在啟動服務前即透過實驗確證\n（validation），並寫入SOP 中"},"pages":[13,14],"images":["assets/115090_308_0502/page-13.jpg","assets/115090_308_0502/page-14.jpg"],"hasImages":false,"id":"115090_308_0502:68","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":69,"stem":"王小明剛被任命為PCR儀器的負責人，有關與前一任負責人交接的作法中，下列何者最不適當？","options":{"A":"PCR 儀器每年度需請工程師以校正過的溫度計進行溫度查驗，查驗的溫度點以反應條件中的最高溫度\n（denaturation所需溫度）即可","B":"將 PCR 儀器的反應條件，依據不同檢驗項目鎖定，避免被不小心異動","C":"PCR 檢測項目每個月計算陽性率，當波動太大時，要檢視是否有污染或儀器、試劑效能不足等可能的問題","D":"當發現 PCR的反應條件需要調整時，需準備適當數量的檢體，進行確證試驗比較調整前後反應結果"},"pages":[14],"images":["assets/115090_308_0502/page-14.jpg"],"hasImages":false,"id":"115090_308_0502:69","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":70,"stem":"在選擇細菌分型法時，若希望具有高再現性（reproducibility）且具國際資料庫可查詢，以便於追蹤疫情時\n菌株的全球傳播，下列那一種方法最適當？","options":{"A":"repetitive element-PCR（REP-PCR）","B":"multilocus sequence typing（MLST）","C":"random amplified polymorphic DNA（RAPD）","D":"amplified fragment length polymorphism（AFLP）"},"pages":[14],"images":["assets/115090_308_0502/page-14.jpg"],"hasImages":false,"id":"115090_308_0502:70","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":71,"stem":"下列何種檢測方式最適合用於 HBV病毒量的檢測？","options":{"A":"branched-chain DNA（bDNA）assay","B":"nucleic acid sequence-based amplification（NASBA）","C":"reverse-transcriptase quantitative PCR（RT-qPCR）","D":"next-generation sequencing（NGS）"},"pages":[14],"images":["assets/115090_308_0502/page-14.jpg"],"hasImages":false,"id":"115090_308_0502:71","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":72,"stem":"關於 16S-23S rRNA基因internal transcribed spacer（ITS）定序法的敘述，下列何者最不適當？","options":{"A":"有些菌種（species）有多條不同長度及序列的ITS","B":"ITS 的增幅法，可分別自16S rRNA基因的3'端保留區至23S rRNA基因的5'端保留區設計引子","C":"ITS 的長度較16S rRNA基因長，故定序比對更精準","D":"ITS 基因序列與16S rRNA基因序列的演化是平行的"},"pages":[14],"images":["assets/115090_308_0502/page-14.jpg"],"hasImages":false,"id":"115090_308_0502:72","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":73,"stem":"下列何者最不常做為乳癌的分子診斷標的？","options":{"A":"雌激素受體（estrogen receptor, ER）","B":"HER2/neu","C":"TP53","D":"APC"},"pages":[14,15],"images":["assets/115090_308_0502/page-14.jpg","assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:73","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":74,"stem":"黑色素細胞瘤患者可藉由檢測下列何種基因的突變，來評估對 vemurafenib的治療效果？","options":{"A":"BRAF","B":"NRAS","C":"MET","D":"PTEN"},"pages":[15],"images":["assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:74","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":75,"stem":"費城染色體會轉譯出那種融合蛋白？","options":{"A":"BCR-ABL1","B":"BRAF-FLT3","C":"ETV6-RUNX1","D":"BTK-BCL-2"},"pages":[15],"images":["assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:75","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":76,"stem":"關於海洋性貧血之基因檢測的敘述，下列何者最適當？","options":{"A":"甲型海洋性貧血的基因檢測主要使用南方墨點法（Southern blot），因其快速且適用於臨床常規檢查","B":"乙型海洋性貧血的基因突變多為大段基因缺失，需使用 gap-PCR進行檢測","C":"甲型海洋性貧血帶因者的篩檢通常以全血計數（CBC）的 MCV≤80 fL或 MCH≤25 pg 作為初步認定標準，隨後\n進行基因型檢查確認","D":"產前診斷甲型海洋性貧血可直接使用傳統PCR，因其不受母血污染影響，能有效避免偽陰性結果"},"pages":[15],"images":["assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:76","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":77,"stem":"關於葡萄糖六磷酸去氫酶（G6PD）缺乏症之敘述，下列何者最適當？","options":{"A":"男女性的罹病機率及表現臨床徵狀皆一致","B":"男性帶有的 G6PD 基因突變者通常會表現出疾病","C":"此疾病通常是由父親遺傳給兒子","D":"女性若為G6PD 基因突變帶因者，完全不會有徵狀出現"},"pages":[15],"images":["assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:77","imageOnlyPages":[],"answer":"B","rule":{"accepted":["B"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":78,"stem":"有關腫瘤基因突變檢測，相較原位組織採檢（tissue biopsy），選擇液態活檢（liquid biopsy）中游離態\nDNA（cfDNA）進行檢測的理由，下列敘述何者最適當？","options":{"A":"萃取的 DNA完整度（integrity）較高","B":"可萃取到的腫瘤DNA 量較多","C":"可於治療後進行非侵入式監控","D":"檢測技術平台較不需要高靈敏度"},"pages":[15],"images":["assets/115090_308_0502/page-15.jpg"],"hasImages":false,"id":"115090_308_0502:78","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":79,"stem":"下列那一個基因在腫瘤細胞中的主要角色不是抑癌基因（tumor suppressor gene）？","options":{"A":"TP53","B":"BRCA1/2","C":"MYC","D":"PTEN"},"pages":[15,16],"images":["assets/115090_308_0502/page-15.jpg","assets/115090_308_0502/page-16.jpg"],"hasImages":false,"id":"115090_308_0502:79","imageOnlyPages":[],"answer":"C","rule":{"accepted":["C"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":80,"stem":"大腸癌在臺灣是發生率相當高的惡性疾病，關於大腸癌的敘述，下列何者最不 列何者最不適當？","options":{"A":"σ值可用來評估檢驗之品質","B":"σ值可代表不同檢驗品質等級，6σ較1σ等級高","C":"利用可容許總誤差、偏差以及變異係數求得σ值","D":"σ值以百分比表示，CAP外部能力試驗須達 99％"},"pages":[2],"images":["assets/115090_308_0504/page-02.jpg"],"hasImages":false,"id":"115090_308_0504:6","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":7,"stem":"有關接受者操作特性曲線（receiver operating characteristic curve, ROC curve）的敘述，下列何者最適\n當？","options":{"A":"ROC 曲線下面積（area under ROC curve, AUC）可用以診斷準確性之比較","B":"ROC 曲線之X 軸代表1-特異性（偽陰性）","C":"藉由 ROC曲線中偽陰性和偽陽性可訂定疾病之發生率","D":"ROC 曲線愈靠近座標圖左下方愈佳"},"pages":[2],"images":["assets/115090_308_0504/page-02.jpg"],"hasImages":false,"id":"115090_308_0504:7","imageOnlyPages":[],"answer":"A","rule":{"accepted":["A"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":8,"stem":"醫學實驗室的品質成本（quality costs）分為符合性成本（costs of conformance）與不符合性成本（costs \nof nonconformance）。下列何者屬於不符合性成本？","options":{"A":"檢驗人員訓練","B":"儀器設備維護","C":"實驗室品管稽核","D":"檢體重複檢驗要求"},"pages":[2],"images":["assets/115090_308_0504/page-02.jpg"],"hasImages":false,"id":"115090_308_0504:8","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":9,"stem":"下列血漿蛋白那些屬於急性期反應蛋白質？①α1–抗胰蛋白酶（α1-antitrypsin） ②α2–巨球蛋白（α2-\nmacroglobulin） ③C–反應蛋白（C-reactive protein） ④胱蛋白 C（cystatin C）","options":{"A":"①②","B":"②③","C":"③④","D":"①③"},"pages":[2],"images":["assets/115090_308_0504/page-02.jpg"],"hasImages":false,"id":"115090_308_0504:9","imageOnlyPages":[],"answer":"D","rule":{"accepted":["D"],"fullCredit":false,"requireAnswer":false,"note":""}},{"number":10,"stem":"血清蛋白在瓊脂凝膠（agarose gel）電泳分離後，下列何種蛋白不出現於β-區（β-zone）？","options":{"A":"C-reactive protein（CRP）","B":"補體 C3","C":"運鐵蛋白（transferrin）","D":"低密度脂蛋白（LDL）"},"pages":[2],"images":["assets/115090_308_0504/page-02.jpg"],"hasImages":false,"id":"115090_308_0504:10","imageOnlyPages":[],"answer":"A","rule":{"accepted":[],"fullCredit":true,"requireAnswer":false,"note":"第10題一律給分 <script>/* Pure scoring functions, shared by the offline application and checks. */
const ExamCore = {
  rule(question){return question.rule || {accepted:[question.answer],fullCredit:false,note:''};},
  correct(question, choice){const r=this.rule(question);return r.fullCredit || (!!choice && (r.requireAnswer || r.accepted.includes(choice)));},
  grade(questions, answers){const rows=questions.map(q=>({id:q.id,number:q.number,choice:answers[q.id]||'',correct:this.correct(q,answers[q.id]),rule:this.rule(q)}));const correct=rows.filter(r=>r.correct).length;return {rows,correct,wrong:rows.filter(r=>!r.correct&&r.choice).length,unanswered:rows.filter(r=>!r.choice).length,total:rows.length,score:rows.length?Math.round(correct/rows.length*10000)/100:0};},
  remaining(session, now=Date.now()){return session.deadline===null?null:Math.max(0,Math.ceil((session.deadline-now)/1000));},
  shuffled(values, random=Math.random){const copy=[...values];for(let i=copy.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
};
if(typeof module!=='undefined')module.exports=ExamCore;
</script><script>'use strict';

try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&Array.isArray(v.history)){saved=v;saved.history=v.history.filter(validRecord);if(saved.active&&!validRecord(saved.active))saved.active=null;}localStorage.setItem(STORE,JSON.stringify(saved));}catch{storageOK=false;}
let screen='home',active=saved.active,review=null,reviewIDs=[],reviewIndex=0,setupExam=null;

function fmt(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function dateLabel(time){return new Date(time).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}

 <div class="section-head"><h2>選擇練習科目</h2><span class="muted">115 年官方試題 · 已套用更正答案</span></div><div class="notice answer-publish"><b>答案即時公布</b><br><span>練習時選擇答案後，立即顯示正確答案、答對／答錯結果及官方更正規則；可在開始前或作答中關閉。</span></div>

 <div class="section-head"><h2>練習紀錄</h2><span class="muted">最近 ${saved.history.length} 次</span></div><div class="history-list">${saved.history.length?saved.history.slice(0,10).map(r=>{const e=exams.get(r.examId),g=ExamCore.grade(recordQuestions(r),r.answers);return `<div class="history-row"><div><b>${escapeHTML(e.title)} <span class="muted">${escapeHTML(e.exam)}</span></b><div class="muted">${dateLabel(r.finishedAt)} · ${r.ids.length} 題 · ${r.mode==='timed'?'計時模擬':'自由練習'}</div></div><div class="action-row"><span class="history-score">${g.score}</span><button class="button ghost" data-result="${r.id}">查看結果</button></div></div>`}).join(''):'<div class="empty">完成第一次練習後，成績與錯題會保留在這裡。</div>'}</div>
 <details class="sources"><summary>資料來源與計分說明</summary><p>民國115年兩次醫事檢驗師考試試題與正式答案，含官方更正公告。每份原卷依實際題數建立題庫；練習成績為每題等權重換算百分制，並非正式考試合格判定。送分與複數正解依各科公告處理。</p><p>本網站資料，歡迎朋友連結使用。但引用時，請註明資料來源並請確保資料之完整（包括本項宣示在內），均不得任意增刪</p></details>`;
 renderCards();$('examFilter').onchange=e=>{filter.exam=e.target.value;renderCards();};$('categoryFilter').onchange=e=>{filter.category=e.target.value;renderCards();};$('search').oninput=e=>{filter.search=e.target.value;renderCards();};
 if(active){$('resume').onclick=()=>{screen='exam';if(ExamCore.remaining(active)===0)finish(true);else renderQuestion();};$('discard').onclick=()=>confirmAction('放棄這次考試？','這次尚未交卷的作答紀錄將移除，先前成績會保留。',()=>{active=null;persist();renderHome();},'放棄');}
 document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>renderResult(saved.history.find(r=>r.id===b.dataset.result)));
}
function renderCards(){const normalize=s=>s.normalize('NFKC').toLowerCase();const list=BANK.exams.filter(e=>(filter.exam==='all'||filter.exam===e.exam)&&(filter.category==='all'||filter.category===e.category)&&normalize(e.title+' '+(e.description||'')).includes(normalize(filter.search)));$('cards').innerHTML=list.map(e=>`<article class="card"><span class="tag">${escapeHTML(e.exam)}</span><h3>${escapeHTML(e.title)}</h3><p>${escapeHTML(e.description||e.category)}</p><div class="card-meta"><span>${escapeHTML(e.category)}</span><span>${e.questions.length} 題</span><span>${e.minutes} 分鐘</span></div><button class="button primary" data-exam="${e.id}">設定並開始 <span aria-hidden="true">↗</span></button></article>`).join('')||'<div class="empty">沒有符合的科目，試試其他關鍵字。</div>';document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>renderSetup(b.dataset.exam));}
function renderSetup(id){
 screen='setup';setupExam=exams.get(id);const e=setupExam,wrong=latestMistakes(id).length;
 $('app').innerHTML=`<div class="setup"><button class="button quiet" id="homeBack">← 回科目清單</button><div class="eyebrow muted">${escapeHTML(e.exam)} · ${escapeHTML(e.category)}</div><h1>${escapeHTML(e.title)}</h1><p class="muted">${escapeHTML(e.description||'')}</p><div class="setup-panel"><div class="setup-grid"><div class="field"><label for="mode">練習模式</label><select id="mode"><option value="timed">計時模擬考 · 時間到自動交卷</option><option value="practice">自由練習 · 不限時間</option></select></div><div class="field"><label for="scope">出題範圍</label><select id="scope"><option value="all">完整試卷 · ${e.questions.length} 題</option><option value="20">隨機練習 · 20 題</option><option value="10">隨機練習 · 10 題</option><option value="wrong" ${wrong?'':'disabled'}>我的錯題 · ${wrong} 題</option></select></div></div><label class="check"><input type="checkbox" id="instantFeedback" checked><b>答案即時公布（預設開啟）</b>：選答案後立即顯示對錯、正確答案與官方更正規則</label><p class="muted">答案公布後仍可繼續修改選項；交卷時以最後選擇計分。若要完整模擬正式考試，可關閉此功能並於交卷後檢視答案。</p><label class="check"><input type="checkbox" id="shuffle">打亂題目順序（保留原題號）</label><p id="setupNote" class="notice"></p><div class="action-row"><button class="button primary" id="start">開始作答</button><a class="button ghost" href="${safeURL(e.source)}" target="_blank" rel="noopener">原始試題 PDF ↗</a></div></div><p class="muted">可隨時提早交卷。作答會自動保存；計時模式開始後持續倒數，關閉頁面也會計入時間。</p></div>`;
 $('homeBack').onclick=markHome;
 const note=()=>{const n=$('scope').value==='all'?e.questions.length:$('scope').value==='wrong'?wrong:Number($('scope').value);const timing=$('mode').value==='timed'?`限時 ${Math.ceil(e.minutes*n/e.questions.length)} 分鐘`:'不限時間';$('setupNote').textContent=`本次 ${n} 題，${timing}。${$('instantFeedback').checked?'選答案後立即核對，含官方更正規則。':'交卷後顯示答案。'}可隨時提早交卷查看成績。`;};
 $('mode').onchange=note;$('scope').onchange=note;$('instantFeedback').onchange=note;note();
 $('start').onclick=()=>{const start=()=>startSession(e,$('scope').value,$('mode').value,$('shuffle').checked,$('instantFeedback').checked);if(active)confirmAction('開始新的考試？','目前未交卷的考試會由新考試取代。先前已交卷成績會保留。',start,'開始新考試');else start();};
}
function startSession(e,scope,mode,shuffle,instantFeedback=true){let ids=e.questions.map(q=>q.id);if(scope==='wrong')ids=latestMistakes(e.id);else if(scope!=='all')ids=ExamCore.shuffled(ids).slice(0,Number(scope));if(shuffle)ids=ExamCore.shuffled(ids);if(!ids.length)return;const now=Date.now(),minutes=Math.ceil(e.minutes*ids.length/e.questions.length);active={id:`r-${now}-${Math.random().toString(36).slice(2,8)}`,examId:e.id,ids,answers:{},flags:{},index:0,startedAt:now,deadline:mode==='timed'?now+minutes*60000:null,mode,instantFeedback:!!instantFeedback};persist();screen='exam';renderQuestion();window.scrollTo(0,0);}
function renderQuestion(){const isReview=screen==='review',r=isReview?review:active;if(!r)return markHome();const ids=isReview?reviewIDs:r.ids,index=isReview?reviewIndex:r.index,q=questions.get(ids[index]),e=exams.get(r.examId),choice=r.answers[q.id],count=r.ids.filter(id=>r.answers[id]).length,rule=ExamCore.rule(q);const images=q.images||[];
 $('app').innerHTML=`<div class="exam-top"><div><span class="muted">${escapeHTML(e.exam)} · ${escapeHTML(e.category)}</span><h1>${escapeHTML(e.title)} <span class="muted">${isReview?'答案檢視':''}</span></h1></div><div class="action-row"><div><div class="muted">${isReview?'已交卷':r.deadline?'剩餘時間':'已練習時間'}</div><div id="clock" class="clock">${isReview?'—':''}</div></div>${!isReview?'<button class="button primary" id="submitTop">提早交卷</button>':''}</div></div>
 <div class="exam-layout"><article class="question-panel"><div class="q-head"><span class="q-number">QUESTION ${String(index+1).padStart(2,'0')} / ${ids.length}　· 原題號 ${q.number}</span>${!isReview?`<button class="button ghost" id="flag" aria-pressed="${!!r.flags[q.id]}">${r.flags[q.id]?'★ 已標記':'☆ 標記稍後作答'}</button>`:''}</div><div class="stem">${escapeHTML(q.stem)}</div>
 ${q.imageOnlyPages?.length?'<p class="notice">本題相關試卷含影像附件，請一併查看下方原題與附圖。</p>':''}
 ${!isReview?`<label class="check feedback-toggle"><input type="checkbox" id="feedbackToggle" ${r.instantFeedback?'checked':''}>即時顯示對錯與正確答案</label>`:''}
 <div class="options" aria-label="選擇答案">${['A','B','C','D'].map(letter=>`<button class="option ${choice===letter?'selected':''}" data-choice="${letter}" aria-pressed="${choice===letter}" ${isReview?'disabled':''}><span class="letter">${letter}</span><span>${escapeHTML(q.options[letter]||'請參照下方原題')}</span></button>`).join('')}</div>
 <div id="answerFeedback" aria-live="polite" aria-atomic="true"></div>
 ${images.length?`<details class="reference" ${q.hasImages||q.imageOnlyPages?.length?'open':''}><summary>查看原題與附圖 · ${images.length} 頁（可點圖放大）</summary><div class="page-images">${images.map((src,i)=>`<a href="${safeURL(src)}" target="_blank" rel="noopener"><img src="${safeURL(src)}" loading="lazy" alt="第 ${q.number} 題的原始試卷頁面 ${i+1}">開啟原尺寸 ↗</a>`).join('')}</div></details>`:''}
 <div class="q-footer"><button class="button ghost" id="previous" ${index===0?'disabled':''}>← 上一題</button><div class="action-row">${!isReview?'<button class="button quiet" id="clearChoice">清除此題選項</button>':''}<button class="button primary" id="next" ${index===ids.length-1?'disabled':''}>下一題 →</button></div></div></article>
 <aside class="nav-panel"><div class="progress-label"><b>${isReview?'題目檢視':'作答進度'}</b><span id="answerCount">${count} / ${r.ids.length}</span></div><div class="progress"><span id="progressFill" style="width:${count/r.ids.length*100}%"></span></div><div class="number-grid">${ids.map((id,i)=>{const item=questions.get(id),a=r.answers[id];return `<button data-jump="${i}" class="${i===index?'current':''} ${a?'answered':''} ${r.flags[id]?'flagged':''} ${isReview&&!ExamCore.correct(item,a)?'wrong':''}" aria-label="第 ${i+1} 題，原題號 ${item.number}${a?'，已作答':''}" ${i===index?'aria-current="true"':''}>${i+1}</button>`;}).join('')}</div><div class="legend">綠底：已答　金點：標記${isReview?'　紅底：錯題':''}</div>${isReview?'<button class="button primary" id="backResults">回成績總覽</button>':'<button class="button primary" id="submit">提早交卷／查看成績</button><button class="button ghost" id="saveHome">儲存並回首頁</button>'}<div class="muted" style="margin-top:15px;font-size:11px">${isReview?'依官方正式答案及更正公告計分。':'選項即時自動儲存 · 可用鍵盤 1–4 作答，左右方向鍵換題。'}</div></aside></div>`;
 const navigate=n=>{if(isReview)reviewIndex=n;else{r.index=n;persist();}renderQuestion();window.scrollTo(0,0);};$('previous').onclick=()=>navigate(index-1);$('next').onclick=()=>navigate(index+1);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.jump)));
 if(isReview)$('backResults').onclick=()=>renderResult(review);
 else{
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));$('clearChoice').onclick=()=>choose(null);
  $('feedbackToggle').onchange=event=>{r.instantFeedback=event.target.checked;persist();updateQuestionFeedback();};
  $('flag').onclick=()=>{r.flags[q.id]=!r.flags[q.id];persist();renderQuestion();};
  $('saveHome').onclick=()=>{persist();markHome();toast(r.deadline?'作答已儲存；計時模式仍持續倒數':'作答已儲存');};
  $('submit').onclick=requestSubmit;$('submitTop').onclick=requestSubmit;updateClock();
 }
 updateQuestionFeedback();
}
function updateQuestionFeedback(){
 const isReview=screen==='review',r=isReview?review:active;if(!r||!$('answerFeedback'))return;
 const id=isReview?reviewIDs[reviewIndex]:r.ids[r.index],q=questions.get(id),e=exams.get(r.examId),choice=r.answers[id],rule=ExamCore.rule(q);
 const visible=isReview||!!(r.instantFeedback&&choice),correct=ExamCore.correct(q,choice);
 document.querySelectorAll('[data-choice]').forEach(b=>{const letter=b.dataset.choice;b.classList.toggle('selected',choice===letter);b.classList.toggle('correct',visible&&ExamCore.correct(q,letter));b.classList.toggle('incorrect',visible&&choice===letter&&!correct);b.setAttribute('aria-pressed',String(choice===letter));});
 const verdict=rule.fullCredit||rule.requireAnswer?(correct?'✓ 依官方公告給分':'未作答，不給分'):(correct?'✓ 答對了':'✕ '+(choice?'答錯了':'尚未作答'));
 $('answerFeedback').innerHTML=visible?`<div class="answer-box ${correct?'':'bad'}"><b>${verdict} · 你的答案：${escapeHTML(choice||'未作答')}</b><p>正確答案：${rule.fullCredit?'本題一律給分':rule.requireAnswer?'有作答即給分（未作答不給分）':rule.accepted.filter(a=>a.length===1).join(' 或 ')}</p>${rule.note?`<p>官方更正：${escapeHTML(rule.note)}</p>`:''}${!isReview?'<p class="muted">可繼續改選；交卷時以最後選擇計分。</p>':''}<div class="action-row"><a href="${safeURL(e.answerSource)}" target="_blank" rel="noopener">正式答案 PDF ↗</a>${e.correctionSource?`<a href="${safeURL(e.correctionSource)}" target="_blank" rel="noopener">更正答案公告 ↗</a>`:''}</div></div>`:'';
}
function choose(letter){if(screen!=='exam'||!active)return;if(ExamCore.remaining(active)===0)return finish(true);const id=active.ids[active.index];if(letter)active.answers[id]=letter;else delete active.answers[id];persist();updateQuestionFeedback();const count=active.ids.filter(id=>active.answers[id]).length;$('answerCount').textContent=`${count} / ${active.ids.length}`;$('progressFill').style.width=count/active.ids.length*100+'%';const jump=document.querySelector(`[data-jump="${active.index}"]`);jump?.classList.toggle('answered',!!letter);jump?.setAttribute('aria-label',`第 ${active.index+1} 題，原題號 ${questions.get(id).number}${letter?'，已作答':''}`);}
function requestSubmit(){
 if(!active)return;if(ExamCore.remaining(active)===0)return finish(true);
 const id=active.id,unanswered=active.ids.filter(qid=>!active.answers[qid]).length;
 confirmAction(unanswered?'確定提早交卷？':'確定交卷？',unanswered?`還有 ${unanswered} 題未作答。確認後會停止本次作答並計算成績；未答題依官方規則計分。`:'全部題目已作答。確認後會停止本次作答並顯示成績與答案。',()=>{if(active?.id===id)finish(ExamCore.remaining(active)===0);},'確認交卷並計分');
}
function updateClock(){if(!active||screen!=='exam'||!$('clock'))return;const sec=ExamCore.remaining(active);$('clock').textContent=sec===null?fmt((Date.now()-active.startedAt)/1000):fmt(sec);$('clock').classList.toggle('urgent',sec!==null&&sec<300);}
function finish(expired){if(!active)return;const r={...active,finishedAt:expired&&active.deadline?active.deadline:Date.now(),expired:!!expired};if(!saved.history.some(h=>h.id===r.id))saved.history.unshift(r);saved.history=saved.history.slice(0,50);active=null;persist();if($('confirmDialog').open)$('confirmDialog').close();renderResult(r);if(expired)toast('時間到，已自動交卷');}
function renderResult(r){screen='result';review=r;showWrong=false;const e=exams.get(r.examId),g=ExamCore.grade(recordQuestions(r),r.answers);$('app').innerHTML=`<div class="action-row"><button class="button quiet" id="resultHome">← 回科目清單</button></div><section class="result-hero"><div><div class="eyebrow">PRACTICE COMPLETED</div><h1>完成一次，進步一步。</h1><div>${escapeHTML(e.title)} · ${escapeHTML(e.exam)}</div><div class="muted" style="color:#bcd6c9">${dateLabel(r.finishedAt)}${r.expired?' · 時間到自動交卷':''}</div></div><div class="result-score">${g.score}<small> / 100</small></div></section><div class="stat-row"><div class="stat"><b>${g.correct}</b><small>答對 / 依公告給分</small></div><div class="stat"><b>${g.wrong}</b><small>答錯且已作答</small></div><div class="stat"><b>${g.unanswered}</b><small>未作答（含公告送分題）</small></div><div class="stat"><b>${fmt((r.finishedAt-r.startedAt)/1000)}</b><small>本次用時</small></div></div><div class="action-row"><button id="reviewAll" class="button primary">逐題檢視答案</button><button id="reviewWrong" class="button ghost" ${g.correct===g.total?'disabled':''}>只看未得分題</button><button id="retry" class="button ghost">再練習這一科</button><button id="export" class="button ghost">匯出作答紀錄</button></div><div class="section-head"><h2>作答明細</h2><label class="muted"><input id="onlyWrong" type="checkbox"> 只顯示未得分題</label></div><div class="table-wrap"><table class="result-table"><thead><tr><th>順序 / 原題號</th><th>你的答案</th><th>正確答案</th><th>結果</th><th></th></tr></thead><tbody id="resultRows"></tbody></table></div><p class="muted">每題等權重換算百分制，依官方更正公告處理複數正解與送分。此分數僅供練習。</p>`;
 const rows=()=>{$('resultRows').innerHTML=g.rows.filter(row=>!showWrong||!row.correct).map(row=>`<tr><td>${r.ids.indexOf(row.id)+1} / ${row.number}</td><td>${row.choice||'未作答'}</td><td>${row.rule.fullCredit?'一律給分':row.rule.requireAnswer?'作答即給分':row.rule.accepted.filter(a=>a.length===1).join(' / ')}</td><td class="${row.correct?'badge-good':'badge-bad'}">${row.correct?'✓ 得分':'未得分'}${row.rule.note?' · 已更正':''}</td><td><button class="button quiet" data-review="${row.id}">檢視</button></td></tr>`).join('')||'<tr><td colspan="5">本次沒有未得分題。</td></tr>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>beginReview(r,r.ids,r.ids.indexOf(b.dataset.review)));};rows();$('onlyWrong').onchange=ev=>{showWrong=ev.target.checked;rows();};$('resultHome').onclick=markHome;$('reviewAll').onclick=()=>beginReview(r,r.ids,0);$('reviewWrong').onclick=()=>beginReview(r,g.rows.filter(row=>!row.correct).map(row=>row.id),0);$('retry').onclick=()=>renderSetup(r.examId);$('export').onclick=()=>{const data={exam:e.title,examSession:e.exam,finishedAt:new Date(r.finishedAt).toISOString(),score:g.score,total:g.total,results:g.rows};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`模擬考紀錄_${r.examId}_${r.finishedAt}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};window.scrollTo(0,0);
}
function beginReview(r,ids,index){review=r;reviewIDs=ids;reviewIndex=index;screen='review';renderQuestion();window.scrollTo(0,0);}
$('brand').onclick=ev=>{ev.preventDefault();persist();markHome();};
document.addEventListener('keydown',ev=>{if(screen!=='exam'||$('confirmDialog').open||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;if('1234'.includes(ev.key)&&ev.key.length===1){ev.preventDefault();choose('ABCD'[Number(ev.key)-1]);}if(ev.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(ev.key==='ArrowLeft'&&!$('previous').disabled)$('previous').click();});
window.addEventListener('beforeunload',persist);
setInterval(()=>{if(active&&ExamCore.remaining(active)===0)finish(true);else updateClock();},1000);
renderHome();if(active&&ExamCore.remaining(active)===0)finish(true);
</script>
